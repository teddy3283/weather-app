<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>壁掛け気象＆カレンダーダッシュボード</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      color: #ffffff;
      font-family: 'Helvetica Neue', Arial, 'メイリオ', sans-serif;
      padding: 15px;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 1.5s ease-in-out;
    }

    /* 12ヶ月の背景グラデーション */
    body.month-1  { background: radial-gradient(circle at 50% 30%, #4a0e1c 0%, #05070a 100%); }
    body.month-2  { background: radial-gradient(circle at 50% 30%, #36124d 0%, #05070a 100%); }
    body.month-3  { background: radial-gradient(circle at 50% 30%, #4d1c31 0%, #05070a 100%); }
    body.month-4  { background: radial-gradient(circle at 50% 30%, #123d29 0%, #05070a 100%); }
    body.month-5  { background: radial-gradient(circle at 50% 30%, #0d4234 0%, #05070a 100%); }
    body.month-6  { background: radial-gradient(circle at 50% 30%, #152b4d 0%, #05070a 100%); }
    body.month-7  { background: radial-gradient(circle at 50% 30%, #0f3954 0%, #05070a 100%); }
    body.month-8  { background: radial-gradient(circle at 50% 30%, #4d2b12 0%, #05070a 100%); }
    body.month-9  { background: radial-gradient(circle at 50% 30%, #1f2d4d 0%, #05070a 100%); }
    body.month-10 { background: radial-gradient(circle at 50% 30%, #4a230f 0%, #05070a 100%); }
    body.month-11 { background: radial-gradient(circle at 50% 30%, #3d1712 0%, #05070a 100%); }
    body.month-12 { background: radial-gradient(circle at 50% 30%, #0e3b22 0%, #05070a 100%); }

    /* 全体 3列グリッドレイアウト（左天気 - 中央時計/カレンダー - 右天気） */
    .dashboard-main {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 15px;
      align-items: start;
    }

    /* 中央カラム（時計＋カレンダー） */
    .center-column {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    header {
      text-align: center;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 15px;
      backdrop-filter: blur(5px);
    }
    #clock {
      font-size: 3.8rem;
      font-weight: bold;
      line-height: 1;
      letter-spacing: 2px;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }
    #date {
      font-size: 1.3rem;
      color: #cbd5e1;
      margin-top: 6px;
    }

    /* カレンダー表示エリア */
    .calendar-card {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 10px;
      backdrop-filter: blur(5px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      height: 480px;
    }
    .calendar-card iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 8px;
      /* カレンダーをダークモードに馴染ませるフィルター */
      filter: invert(0.9) hue-rotate(180deg) contrast(0.9);
    }

    /* エリアカラム（左右） */
    .area-column {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
    }

    /* 現在の天気カード */
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }
    .card-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 3px;
    }
    .temp-main {
      font-size: 2.3rem;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }
    .details {
      font-size: 0.9rem;
      color: #cbd5e1;
      margin-top: 3px;
    }

    .sub-title {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 3px;
    }

    /* 予報リスト */
    .forecast-list {
      display: flex;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 5px;
    }
    .forecast-item {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px 4px;
      min-width: 62px;
      text-align: center;
      flex-shrink: 0;
    }
    .forecast-item .time { font-size: 0.75rem; color: #94a3b8; }
    .forecast-item .icon { margin: 1px 0; }
    .forecast-item .temp { font-size: 0.9rem; font-weight: bold; font-variant-numeric: tabular-nums; }
    .forecast-item .temp-range { font-size: 0.75rem; font-variant-numeric: tabular-nums; }
    .forecast-item .temp-max { color: #f87171; font-weight: bold; }
    .forecast-item .temp-min { color: #38bdf8; font-weight: bold; }
    .forecast-item .humidity { font-size: 0.7rem; color: #60a5fa; margin-top: 2px; }
  </style>
</head>
<body id="body-root">

  <div class="dashboard-main">
    
    <!-- 左列：エリア1 天気 -->
    <div class="area-column">
      <div class="card" id="area1-current"><div class="card-title">エリア1</div>読み込み中...</div>
      <div>
        <div class="sub-title">▼ 3時間ごとの予報</div>
        <div class="forecast-list" id="area1-hourly">読み込み中...</div>
      </div>
      <div>
        <div class="sub-title">▼ 週間予報（最高 / 最低）</div>
        <div class="forecast-list" id="area1-daily">読み込み中...</div>
      </div>
    </div>

    <!-- 中央列：時計 ＆ Googleカレンダー -->
    <div class="center-column">
      <header>
        <div id="clock">00:00:00</div>
        <div id="date">----年--月--日(--)</div>
      </header>
      
      <div class="calendar-card">
        <!-- 取得したGoogleカレンダーのiframeタグの「src="..."」のURLをここに貼り付けます -->
        <iframe src="https://calendar.google.com/calendar/embed?src=ja.japanese%23holiday%40group.v.calendar.google.com&ctz=Asia%2FTokyo"></iframe>
      </div>
    </div>

    <!-- 右列：エリア2 天気 -->
    <div class="area-column">
      <div class="card" id="area2-current"><div class="card-title">エリア2</div>読み込み中...</div>
      <div>
        <div class="sub-title">▼ 3時間ごとの予報</div>
        <div class="forecast-list" id="area2-hourly">読み込み中...</div>
      </div>
      <div>
        <div class="sub-title">▼ 週間予報（最高 / 最低）</div>
        <div class="forecast-list" id="area2-daily">読み込み中...</div>
      </div>
    </div>

  </div>

  <script>
    // ===== 設定情報 =====
    const API_KEY = '533cf8da09f4a533b46fe9b63385d095'; // 取得した32桁のAPIキー
    const AREA_1 = { name: '大牟田', lat: 33.041, lon: 130.471 }; // 1つ目の場所
    const AREA_2 = { name: '熊本', lat: 32.715, lon: 130.733 }; // 2つ目の場所

    // ====================

    function updateClock() {
      const now = new Date();
      const days = ['日', '月', '火', '水', '木', '金', '土'];
      
      document.getElementById('clock').textContent =
        `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
      document.getElementById('date').textContent =
        `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 (${days[now.getDay()]})`;

      const month = now.getMonth() + 1;
      document.getElementById('body-root').className = `month-${month}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchWeather() {
      if (API_KEY === 'YOUR_API_KEY_HERE') return;

      try {
        const res1 = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${AREA_1.lat}&lon=${AREA_1.lon}&appid=${API_KEY}&units=metric&lang=ja`);
        const data1 = await res1.json();

        const res2 = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${AREA_2.lat}&lon=${AREA_2.lon}&appid=${API_KEY}&units=metric&lang=ja`);
        const data2 = await res2.json();

        renderCurrent('area1-current', AREA_1.name, data1.list[0]);
        renderHourly('area1-hourly', data1.list.slice(0, 8));
        renderDaily('area1-daily', data1.list);

        renderCurrent('area2-current', AREA_2.name, data2.list[0]);
        renderHourly('area2-hourly', data2.list.slice(0, 8));
        renderDaily('area2-daily', data2.list);

      } catch (err) {
        console.error('天気データの取得失敗:', err);
      }
    }

    function getIconUrl(iconCode) {
      return `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
    }

    function renderCurrent(elementId, name, item) {
      document.getElementById(elementId).innerHTML = `
        <div class="card-title">${name}</div>
        <img src="${getIconUrl(item.weather[0].icon)}" width="45">
        <div class="temp-main">${Math.round(item.main.temp)}℃</div>
        <div class="details">湿度: ${item.main.humidity}% / ${item.weather[0].description}</div>
      `;
    }

    function renderHourly(elementId, list) {
      const container = document.getElementById(elementId);
      container.innerHTML = list.map(item => {
        const time = new Date(item.dt * 1000).getHours() + '時';
        return `
          <div class="forecast-item">
            <div class="time">${time}</div>
            <img class="icon" src="${getIconUrl(item.weather[0].icon)}" width="30">
            <div class="temp">${Math.round(item.main.temp)}℃</div>
            <div class="humidity">💧${item.main.humidity}%</div>
          </div>
        `;
      }).join('');
    }

    function renderDaily(elementId, list) {
      const container = document.getElementById(elementId);
      const dailyMap = {};
      list.forEach(item => {
        const dateKey = item.dt_txt.split(' ')[0];
        if (!dailyMap[dateKey]) dailyMap[dateKey] = [];
        dailyMap[dateKey].push(item);
      });

      const daysKeys = Object.keys(dailyMap).slice(0, 6);
      container.innerHTML = daysKeys.map(dateKey => {
        const items = dailyMap[dateKey];
        let maxTemp = -99;
        let minTemp = 99;
        let sumHumidity = 0;
        let noonIcon = items[0].weather[0].icon;

        items.forEach(item => {
          if (item.main.temp_max > maxTemp) maxTemp = item.main.temp_max;
          if (item.main.temp_min < minTemp) minTemp = item.main.temp_min;
          sumHumidity += item.main.humidity;
          if (item.dt_txt.includes("12:00:00")) noonIcon = item.weather[0].icon;
        });

        const avgHumidity = Math.round(sumHumidity / items.length);
        const dateObj = new Date(dateKey);
        const dateStr = `${dateObj.getMonth()+1}/${dateObj.getDate()}`;

        return `
          <div class="forecast-item">
            <div class="time">${dateStr}</div>
            <img class="icon" src="${getIconUrl(noonIcon)}" width="30">
            <div class="temp-range">
              <span class="temp-max">${Math.round(maxTemp)}°</span> / 
              <span class="temp-min">${Math.round(minTemp)}°</span>
            </div>
            <div class="humidity">💧${avgHumidity}%</div>
          </div>
        `;
      }).join('');
    }

    fetchWeather();
    setInterval(fetchWeather, 30 * 60 * 1000);
  </script>
</body>
</html>
